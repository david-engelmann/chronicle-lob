name: CI

# Continuous integration gate layout for chronicle-lob.
# See docs/ARCHITECTURE.md section 9 and CONTRIBUTING.md for local equivalents.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Determinism contract: every simulation and property run prints its seed.
  # PR runs use seed 42 with 1,000 proptest cases. Main runs use the wider
  # sweep in the seed-sweep job below (DECISIONS.md Q6).
  SIM_SEED: "42"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo fmt --check
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (pedantic, nursery, deny todo/unimplemented)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo clippy --workspace --all-targets --all-features --locked
        if: steps.ws.outputs.present == 'true'
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings

  test:
    name: test (PR volume, 1,000 cases)
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "1000"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo test --workspace --locked
        if: steps.ws.outputs.present == 'true'
        run: |
          echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
          cargo test --workspace --locked

  seed-sweep:
    name: seed sweep (main volume, 10,000 cases)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "10000"
    steps:
      - uses: actions/checkout@v7.0.1
      # Rotate the sweep seed with the GitHub Actions run number so successive
      # main-branch builds explore fresh command streams while remaining
      # reproducible locally via SIM_SEED.
      - name: Derive this run's seed
        run: echo "SIM_SEED=$(( ${{ github.run_number }} + 10000 ))" >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo test --workspace --locked (full seed sweep)
        if: steps.ws.outputs.present == 'true'
        run: |
          echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
          cargo test --workspace --locked

  seed-sweep-second:
    name: seed sweep, second seed (main volume, 10,000 cases)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "10000"
    steps:
      - uses: actions/checkout@v7.0.1
      # Offset from the primary sweep stream so both sweeps explore distinct
      # seeds within the same main-branch run.
      - name: Derive this run's seed
        run: echo "SIM_SEED=$(( ${{ github.run_number }} + 20000 ))" >> "$GITHUB_ENV"
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      # Run main-branch property suites across two independent seeds so an
      # ambient-seed leak cannot hide behind a single stream.
      - name: cargo test --workspace --locked (second seed sweep)
        if: steps.ws.outputs.present == 'true'
        run: |
          echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
          cargo test --workspace --locked

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-doc-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-doc-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo doc --workspace --no-deps --locked
        if: steps.ws.outputs.present == 'true'
        run: cargo doc --workspace --no-deps --locked

  bench-compile:
    name: bench compile check (cargo bench -- --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo bench --workspace --locked -- --test
        if: steps.ws.outputs.present == 'true'
        run: cargo bench --workspace --locked -- --test

  zero-dep-core:
    name: chronicle-core stays std-only and zero-dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f crates/chronicle-core/Cargo.toml ]; then
          echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No core crate yet (Milestone 0). Skipping."; fi
      # Assert zero runtime dependencies using cargo metadata rather than text
      # parsing; only dev and build dependencies are permitted.
      - name: Assert no non-dev dependencies in chronicle-core (cargo metadata)
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo metadata --format-version 1 --locked --no-deps > /tmp/meta.json
          python3 - <<'PY'
          import json, sys
          meta = json.load(open("/tmp/meta.json"))
          core = [p for p in meta["packages"] if p["name"] == "chronicle-core"]
          if not core:
              print("chronicle-core package not found in cargo metadata")
              sys.exit(1)
          bad = [d["name"] for d in core[0]["dependencies"]
                 if d["kind"] not in ("dev", "build")]
          if bad:
              print("chronicle-core has non-dev dependencies:", bad)
              sys.exit(1)
          print("chronicle-core: zero non-dev dependencies (cargo metadata). OK.")
          PY

  determinism-gate:
    name: determinism gate (INV-DET-1 forbidden tokens in core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check core and wal sources presence
        id: ws
        run: |
          if [ -d crates/chronicle-core/src ] && [ -d crates/chronicle-wal/src ]; then
          echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "Sources missing. Skipping."; fi
      # INV-DET-1: chronicle-core and chronicle-wal sources must not
      # mention wall clocks, monotonic timers, process-seeded
      # randomness, default hashers, or std hash-map types. The
      # reference oracle module in chronicle-core is excluded by
      # design; it uses BTreeMap only.
      - name: Scan chronicle-core and chronicle-wal sources for forbidden tokens
        if: steps.ws.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          import pathlib, sys
          forbidden = [
              "SystemTime",
              "Instant",
              "thread_rng",
              "RandomState",
              "DefaultHasher",
              "HashMap",
              "HashSet",
          ]
          roots = [
              (pathlib.Path("crates/chronicle-core/src"), {"reference_book.rs"}),
              (pathlib.Path("crates/chronicle-wal/src"), set()),
          ]
          hits = []
          for root, excluded in roots:
              for path in sorted(root.rglob("*.rs")):
                  if path.name in excluded:
                      continue
                  text = path.read_text()
                  for token in forbidden:
                      start = 0
                      while True:
                          i = text.find(token, start)
                          if i < 0:
                              break
                          hits.append(f"{path}:{text[:i].count(chr(10)) + 1}: {token}")
                          start = i + 1
          if hits:
              print("Forbidden determinism tokens found in chronicle-core / chronicle-wal:")
              print("\n".join(hits))
              sys.exit(1)
          print("chronicle-core and chronicle-wal: no forbidden determinism tokens. OK.")
          PY

  package:
    name: crates package cleanly (publication readiness, R1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-package-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-package-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      # Topological packaging check: chronicle-core has zero workspace
      # dependencies so its full verification build runs on every push
      # and PR, including version-bump branches before crates.io
      # publishes the new version. Downstream crates resolve workspace
      # dependencies from crates.io during `cargo package` builds, so
      # CI verifies their packaged file manifests in topological order
      # (`chronicle-wal`, then `chronicle-lob-cli`) while `publish.yml`
      # runs full verification builds per crate as each step lands on
      # crates.io.
      - name: cargo package chronicle-core (verification build)
        if: steps.ws.outputs.present == 'true'
        run: cargo package -p chronicle-core --locked
      - name: cargo package --list for downstream crates in topological order
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo package --list -p chronicle-wal --locked
          cargo package --list -p chronicle-lob-cli --locked

  examples:
    name: examples run with pinned output (R2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-examples-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      # Each example's stdout is diffed against a checked-in expected file so
      # runnable documentation stays verified on every change.
      - name: Run the examples and diff against their pinned output
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo run --locked -p chronicle-core --example book_session > /tmp/book_session.out
          diff -u crates/chronicle-core/examples/book_session.expected.txt /tmp/book_session.out
          cargo run --locked -p chronicle-wal --example wal_recovery > /tmp/wal_recovery.out
          diff -u crates/chronicle-wal/examples/wal_recovery.expected.txt /tmp/wal_recovery.out
          cargo build --locked -p chronicle-lob-cli --bin chronicle-cli
          python3 -m unittest discover -s python/tests -v

  deny:
    name: cargo-deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Install cargo-deny
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny check

  # Cross-platform verification runs the test and example suites on macOS and
  # Windows at pull-request volume under bash so behaviour is verified across
  # all supported operating systems on every change.
  test-platforms:
    name: test (PR volume, macOS and Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PROPTEST_CASES: "1000"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo test --workspace --locked
        if: steps.ws.outputs.present == 'true'
        shell: bash
        run: |
          echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
          cargo test --workspace --locked

  examples-platforms:
    name: examples run with pinned output (macOS and Windows)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-examples-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-examples-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Check workspace presence
        id: ws
        shell: bash
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      # The diff ignores carriage returns at line ends: the
      # Windows text convention adds them on one side or the
      # other, and the pinned guarantee is the text itself.
      - name: Run the examples and diff against their pinned output
        if: steps.ws.outputs.present == 'true'
        shell: bash
        run: |
          cargo run --locked -p chronicle-core --example book_session > /tmp/book_session.out
          diff --strip-trailing-cr -u crates/chronicle-core/examples/book_session.expected.txt /tmp/book_session.out
          cargo run --locked -p chronicle-wal --example wal_recovery > /tmp/wal_recovery.out
          diff --strip-trailing-cr -u crates/chronicle-wal/examples/wal_recovery.expected.txt /tmp/wal_recovery.out
