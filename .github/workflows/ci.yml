name: CI

# Gate layout for chronicle-lob. See docs/ARCHITECTURE.md section 9 and
# CONTRIBUTING.md (Milestone 4) for the local equivalents.
#
# History: at Milestone 0 this repo contained no Cargo.toml and no Rust
# sources yet, by design, and every cargo job first checked for the
# workspace manifest and reported the skip plainly. Milestone 1 landed
# the workspace, so the guards are inert and every gate runs at full
# strength. The guards stay as harmless no-ops; they never weaken a
# gate now that sources exist.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Determinism contract: every simulation and property run prints its seed.
  # PR runs use seed 42 with 1,000 proptest cases. Main runs use the wider
  # sweep in the seed-sweep job below (DECISIONS.md Q6).
  SIM_SEED: "42"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo fmt --check
        if: steps.ws.outputs.present == 'true'
        run: cargo fmt --all -- --check

  clippy:
    name: clippy (pedantic, nursery, deny todo/unimplemented)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo clippy --workspace --all-targets --all-features --locked
        if: steps.ws.outputs.present == 'true'
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings

  test:
    name: test (PR volume, 1,000 cases)
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo test --workspace --locked
        if: steps.ws.outputs.present == 'true'
        run: |
          echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
          cargo test --workspace --locked

  seed-sweep:
    name: seed sweep (main volume, 10,000 cases)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: "10000"
      SIM_SEED: "10000"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo test --workspace --locked (full seed sweep)
        if: steps.ws.outputs.present == 'true'
        run: |
          echo "SIM_SEED=$SIM_SEED PROPTEST_CASES=$PROPTEST_CASES"
          cargo test --workspace --locked

  doc:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo doc --workspace --no-deps --locked
        if: steps.ws.outputs.present == 'true'
        run: cargo doc --workspace --no-deps --locked

  bench-compile:
    name: bench compile check (cargo bench -- --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f Cargo.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No Cargo.toml yet (Milestone 0). Skipping cargo gates."; fi
      - name: cargo bench --workspace --locked -- --test
        if: steps.ws.outputs.present == 'true'
        run: cargo bench --workspace --locked -- --test

  zero-dep-core:
    name: chronicle-core stays std-only and zero-dependency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Check workspace presence
        id: ws
        run: |
          if [ -f crates/chronicle-core/Cargo.toml ]; then
          echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No core crate yet (Milestone 0). Skipping."; fi
      # Audit m4 (accepted at Milestone 1): assert on cargo's own
      # metadata, not on a text parse of the manifest. A dependency
      # counts unless cargo reports its kind as dev or build.
      - name: Assert no non-dev dependencies in chronicle-core (cargo metadata)
        if: steps.ws.outputs.present == 'true'
        run: |
          cargo metadata --format-version 1 --locked --no-deps > /tmp/meta.json
          python3 - <<'PY'
          import json, sys
          meta = json.load(open("/tmp/meta.json"))
          core = [p for p in meta["packages"] if p["name"] == "chronicle-core"]
          if not core:
              print("chronicle-core package not found in cargo metadata")
              sys.exit(1)
          bad = [d["name"] for d in core[0]["dependencies"]
                 if d["kind"] not in ("dev", "build")]
          if bad:
              print("chronicle-core has non-dev dependencies:", bad)
              sys.exit(1)
          print("chronicle-core: zero non-dev dependencies (cargo metadata). OK.")
          PY

  determinism-gate:
    name: determinism gate (INV-DET-1 forbidden tokens in core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check core sources presence
        id: ws
        run: |
          if [ -d crates/chronicle-core/src ]; then
          echo "present=true" >> "$GITHUB_OUTPUT";
          else echo "present=false" >> "$GITHUB_OUTPUT";
          echo "No core sources yet (Milestone 0). Skipping."; fi
      # INV-DET-1: chronicle-core sources must not mention wall clock,
      # process-seeded randomness, or std hash-map types. The reference
      # oracle module is excluded by design; it uses BTreeMap only.
      - name: Scan chronicle-core sources for forbidden tokens
        if: steps.ws.outputs.present == 'true'
        run: |
          python3 - <<'PY'
          import pathlib, sys
          forbidden = ["SystemTime", "Instant::now", "thread_rng",
                       "RandomState", "HashMap", "HashSet"]
          excluded = {"reference_book.rs"}
          hits = []
          root = pathlib.Path("crates/chronicle-core/src")
          for path in sorted(root.rglob("*.rs")):
              if path.name in excluded:
                  continue
              text = path.read_text()
              for token in forbidden:
                  start = 0
                  while True:
                      i = text.find(token, start)
                      if i < 0:
                          break
                      hits.append(f"{path}:{text[:i].count(chr(10)) + 1}: {token}")
                      start = i + 1
          if hits:
              print("Forbidden determinism tokens found in chronicle-core:")
              print("\n".join(hits))
              sys.exit(1)
          print("chronicle-core: no forbidden determinism tokens. OK.")
          PY
