name: benchmarks

# Roadmap lane R5 (docs/ROADMAP.md): performance baselines come
# from this manually dispatched workflow, never from the regular
# CI jobs, whose benches are compile-checked only. The first run's
# numbers are recorded in docs/PERFORMANCE.md with this run's id,
# the runner class, and each benchmark's configuration.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bench:
    name: criterion benchmarks (full measurement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
      - name: Cache cargo registry and target
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: cargo bench --workspace --locked
        run: cargo bench --workspace --locked
      - name: Upload criterion reports
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion
          if-no-files-found: error
