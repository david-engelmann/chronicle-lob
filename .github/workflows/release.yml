name: release

# Builds precompiled `chronicle-cli` release archives across Linux,
# macOS, and Windows together with `SHA256SUMS` whenever a `v*.*.*`
# tag is pushed. Archive naming matches `[package.metadata.binstall]`
# in `crates/chronicle-cli/Cargo.toml` so `cargo binstall
# chronicle-lob-cli` resolves release binaries directly.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.3.0) for dry-run builds"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build:
    name: build chronicle-cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned toolchain for target
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          target: ${{ matrix.target }}
      - name: Ensure target standard library is installed
        shell: bash
        run: rustup target add "${{ matrix.target }}"
      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-${{ matrix.target }}-
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Build release binary and smoke-test
        shell: bash
        run: |
          cargo build --release --locked -p chronicle-lob-cli --target "${{ matrix.target }}"
          BIN="target/${{ matrix.target }}/release/chronicle-cli${{ matrix.ext }}"
          if [ "${{ matrix.target }}" != "x86_64-apple-darwin" ]; then
            "$BIN" --version
          fi
      - name: Package tarball
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          STAGE="chronicle-cli-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STAGE}"
          cp "target/${{ matrix.target }}/release/chronicle-cli${{ matrix.ext }}" "dist/${STAGE}/"
          cp LICENSE-MIT LICENSE-APACHE "dist/${STAGE}/"
          cp crates/chronicle-cli/README.md "dist/${STAGE}/README.md"
          tar -C dist -czf "dist/${STAGE}.tar.gz" "${STAGE}"
      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: checksums and GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Download release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download "${{ github.run_id }}" --pattern "release-*" --dir release-raw
          find release-raw -name '*.tar.gz' -exec cp {} release-assets/ \;
          ls -la release-assets
      - name: Generate and verify SHA256SUMS
        working-directory: release-assets
        run: |
          sha256sum chronicle-cli-*.tar.gz | sort -k 2 > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS
      - name: Upload release bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle
          path: |
            release-assets/*.tar.gz
            release-assets/SHA256SUMS
          if-no-files-found: error
      - name: Attach assets to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: release-assets
        run: |
          TAG="${GITHUB_REF_NAME}"
          python3 - <<'PY'
          import os, pathlib
          ver = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          lines = pathlib.Path("../CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          start = None
          end = len(lines)
          prefix = f"## [{ver}]"
          for i, line in enumerate(lines):
              if start is None:
                  if line.startswith(prefix):
                      start = i + 1
              elif line.startswith("## "):
                  end = i
                  break
          notes = "\n".join(lines[start:end]).strip() if start is not None else f"Release {ver}"
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          PY
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" chronicle-cli-*.tar.gz SHA256SUMS --clobber
            gh release edit "${TAG}" --title "${TAG}" --notes-file release-notes.md --latest
          else
            gh release create "${TAG}" chronicle-cli-*.tar.gz SHA256SUMS --title "${TAG}" --notes-file release-notes.md --latest
          fi
