[package]
name = "chronicle-wal"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "CRC32C write-ahead log and atomic snapshots for chronicle order books"
license = "MIT OR Apache-2.0"
keywords = ["write-ahead-log", "wal", "durability", "deterministic"]
categories = ["data-structures", "filesystem"]
repository = "https://github.com/david-engelmann/chronicle-lob"

[dependencies]
chronicle-core = { version = "0.2.0", path = "../chronicle-core" }

[dev-dependencies]
proptest = "1"
criterion = "0.8"

[[bench]]
name = "bench_wal_append"
harness = false

[[bench]]
name = "bench_recovery"
harness = false

[[bench]]
name = "bench_snapshot"
harness = false

[lints]
workspace = true
