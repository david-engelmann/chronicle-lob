[package]
# The package is chronicle-lob-cli because chronicle-cli is already
# taken on crates.io (docs/ROADMAP.md, direction call DC-2). The
# binary below keeps the name chronicle-cli, so installed usage does
# not change.
name = "chronicle-lob-cli"
version = "0.3.1"
edition = "2024"
rust-version = "1.100"
description = "Command line replay, verification, snapshot, and benchmark tool for chronicle books"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/chronicle-lob-cli"
keywords = ["orderbook", "replay", "cli", "deterministic"]
categories = ["command-line-utilities", "finance"]
repository = "https://github.com/david-engelmann/chronicle-lob"

[lib]
name = "chronicle_lob_cli"
path = "src/lib.rs"

[[bin]]
name = "chronicle-cli"
path = "src/main.rs"

[dependencies]
chronicle-core = { version = "0.3.1", path = "../chronicle-core" }
chronicle-wal = { version = "0.3.1", path = "../chronicle-wal" }
clap = { version = "4", features = ["env"] }
serde_json = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/chronicle-cli-v{ version }-{ target }{ archive-suffix }"
bin-dir = "chronicle-cli-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints]
workspace = true
