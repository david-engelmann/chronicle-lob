[package]
# Published on crates.io as chronicle-lob-cli because the chronicle-cli
# crate name is already taken. The installed binary retains the name
# chronicle-cli so CLI invocations stay uniform across install methods.
name = "chronicle-lob-cli"
version = "0.3.2"
edition = "2024"
rust-version = "1.100"
description = "Command line replay, verification, snapshot, and benchmark tool for chronicle books"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/chronicle-lob-cli"
keywords = ["orderbook", "replay", "cli", "deterministic"]
categories = ["command-line-utilities", "finance"]
repository = "https://github.com/david-engelmann/chronicle-lob"

[lib]
name = "chronicle_lob_cli"
path = "src/lib.rs"

[[bin]]
name = "chronicle-cli"
path = "src/main.rs"

[dependencies]
chronicle-core = { version = "0.3.2", path = "../chronicle-core" }
chronicle-wal = { version = "0.3.2", path = "../chronicle-wal" }
clap = { version = "4", features = ["env"] }
serde_json = "1"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/chronicle-cli-v{ version }-{ target }{ archive-suffix }"
bin-dir = "chronicle-cli-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints]
workspace = true
