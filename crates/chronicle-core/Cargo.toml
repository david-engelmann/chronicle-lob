[package]
name = "chronicle-core"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "Single-threaded deterministic limit order book and matching engine with zero steady-state allocation"
license = "MIT OR Apache-2.0"
keywords = ["orderbook", "matching-engine", "trading", "deterministic"]
categories = ["data-structures", "finance"]
repository = "https://github.com/david-engelmann/chronicle-lob"

# DECISIONS.md Q5: chronicle-core is strictly std-only. This section stays
# empty forever. CI asserts it from cargo metadata (zero-dep-core job).
[dependencies]

[dev-dependencies]
proptest = "1"
criterion = "0.8"

[[bench]]
name = "bench_add_cancel_best"
harness = false

[[bench]]
name = "bench_match_sweep"
harness = false

[[bench]]
name = "bench_depth"
harness = false

[[bench]]
name = "bench_amend"
harness = false

[[bench]]
name = "bench_mass_cancel"
harness = false

[lints]
workspace = true
