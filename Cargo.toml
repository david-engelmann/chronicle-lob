# chronicle-lob workspace (docs/ARCHITECTURE.md section 2).
[workspace]
resolver = "3"
members = ["crates/chronicle-core", "crates/chronicle-wal", "crates/chronicle-cli"]

# Lint posture: docs/ARCHITECTURE.md section 2.4. Crates opt in with
# [lints] workspace = true in their own Cargo.toml.
[workspace.lints.rust]
# Every public item must carry rustdoc comments; undocumented items fail CI.
missing_docs = "deny"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
todo = "deny"
unimplemented = "deny"
allow_attributes_without_reason = "deny"

# Checked arithmetic must hold in tests exactly as in release: a wrap in
# a test is a failure, never a silent pass (INV-MATH-1).
[profile.dev]
overflow-checks = true

[profile.test]
overflow-checks = true
